<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>编辑用户权限</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user-pages.css') }}">
  <script src="{{ url_for('users.static', filename='js/auth_client.js') }}"></script>
</head>
<body class="user-page edit-user-page">
  <div class="card">
    <h2>编辑用户权限</h2>
    <label>用户名：
      <input type="text" id="username" placeholder="请输入要编辑的用户名">
    </label>

    <fieldset>
      <legend>权限设置</legend>
      <label><input type="checkbox" id="perm_storyteller"> 说书人（魔典创建房间、下载 json 等）</label>
      <label><input type="checkbox" id="perm_botc_edition_author"> 《染》剧本作者（导入/编辑剧本）</label>
      <label><input type="checkbox" id="perm_trpg_dm"> 跑团 DM</label>
      <label><input type="checkbox" id="perm_trpg_module_author"> 跑团模组作者</label>
      <p class="hint">账户管理权限随「管理员」协会身份自动授予，无需单独勾选。</p>
    </fieldset>
    <fieldset>
      <legend>协会身份</legend>
      <label for="association_role">协会身份：</label>
      <select id="association_role">
        <option value="普通玩家">普通玩家</option>
        <option value="协会玩家">协会玩家</option>
        <option value="核心玩家">核心玩家</option>
        <option value="干事">干事</option>
        <option value="管理员">管理员</option>
      </select>
    </fieldset>

    <div class="btn-row">
      <button id="saveBtn">保存权限</button>
      <button id="saveAssociationBtn">保存协会身份</button>
      <button id="viewProfileBtn" type="button">查看档案</button>
    </div>
    <div class="status" id="status"></div>

    <div class="profile-view" id="profileView">
      <h3>用户档案</h3>
      <table>
        <tr><td>用户名</td><td id="profile_username">-</td></tr>
        <tr><td>用户ID</td><td id="profile_id">-</td></tr>
        <tr><td>协会身份</td><td id="profile_association_role">-</td></tr>
        <tr><td>社会身份</td><td id="profile_social_role">-</td></tr>
        <tr><td>联系方式</td><td id="profile_contact_info">-</td></tr>
        <tr><td>组织活动次数</td><td id="profile_activity_organized_count">0</td></tr>
        <tr><td>参与活动次数</td><td id="profile_activity_joined_count">0</td></tr>
        <tr><td>缺席活动次数</td><td id="profile_activity_absent_count">0</td></tr>
        <tr><td>账户管理（管理员）</td><td id="profile_is_admin">❌ 否</td></tr>
        <tr><td>说书人</td><td id="profile_permission_storyteller">❌ 否</td></tr>
        <tr><td>《染》剧本作者</td><td id="profile_permission_botc_edition_author">❌ 否</td></tr>
        <tr><td>跑团 DM</td><td id="profile_permission_trpg_dm">❌ 否</td></tr>
        <tr><td>跑团模组作者</td><td id="profile_permission_trpg_module_author">❌ 否</td></tr>
      </table>
    </div>
  </div>

  <script>
    function setStatus(ok, text) {
      const statusDiv = document.getElementById("status");
      statusDiv.textContent = text;
      statusDiv.className = ok ? "status success" : "status error";
    }

    function toYesNo(value) {
      return value ? "✅ 是" : "❌ 否";
    }

    function renderProfile(data) {
      document.getElementById("profileView").style.display = "block";
      document.getElementById("profile_username").textContent = data.username || "-";
      document.getElementById("profile_id").textContent = data.id ?? "-";
      document.getElementById("profile_association_role").textContent = data.association_role || "普通玩家";
      document.getElementById("profile_social_role").textContent = data.social_role || "保密";
      document.getElementById("profile_contact_info").textContent = data.contact_info || "保密";
      document.getElementById("profile_activity_organized_count").textContent = data.activity_organized_count ?? 0;
      document.getElementById("profile_activity_joined_count").textContent = data.activity_joined_count ?? 0;
      document.getElementById("profile_activity_absent_count").textContent = data.activity_absent_count ?? 0;
      document.getElementById("profile_is_admin").textContent = toYesNo((data.association_rank ?? 0) === 4);
      document.getElementById("profile_permission_storyteller").textContent = toYesNo(!!data.permission_storyteller);
      document.getElementById("profile_permission_botc_edition_author").textContent = toYesNo(!!data.permission_botc_edition_author);
      document.getElementById("profile_permission_trpg_dm").textContent = toYesNo(!!data.permission_trpg_dm);
      document.getElementById("profile_permission_trpg_module_author").textContent = toYesNo(!!data.permission_trpg_module_author);
    }

    document.getElementById("saveBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("请输入用户名");
        return;
      }

      const payload = {
        username: username,
        permission_storyteller: document.getElementById("perm_storyteller").checked ? 1 : 0,
        permission_botc_edition_author: document.getElementById("perm_botc_edition_author").checked ? 1 : 0,
        permission_trpg_dm: document.getElementById("perm_trpg_dm").checked ? 1 : 0,
        permission_trpg_module_author: document.getElementById("perm_trpg_module_author").checked ? 1 : 0,
      };

      try {
        const res = await ClockTowerAuth.authFetch("/user/permission_update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (data.status === "success") {
          setStatus(true, "✅ 权限更新成功！");
        } else {
          setStatus(false, "❌ 更新失败：" + (data.reason || "未知错误"));
        }
      } catch (e) {
        setStatus(false, "❌ 网络错误或服务器异常");
      }
    };

    document.getElementById("saveAssociationBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("请输入用户名");
        return;
      }

      const payload = {
        username: username,
        association_role: document.getElementById("association_role").value,
      };

      try {
        const res = await ClockTowerAuth.authFetch("/user/association_role_update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.status === "success") {
          setStatus(true, `✅ 协会身份已更新为：${data.association_role}`);
        } else {
          setStatus(false, "❌ 更新失败：" + (data.reason || "未知错误"));
        }
      } catch (e) {
        setStatus(false, "❌ 网络错误或服务器异常");
      }
    };

    document.getElementById("viewProfileBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("请输入用户名");
        return;
      }
      try {
        const res = await ClockTowerAuth.authFetch("/user/view_user_by_name", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        const data = await res.json();
        if (data.status === "success") {
          renderProfile(data);
          document.getElementById("perm_storyteller").checked = !!data.permission_storyteller;
          document.getElementById("perm_botc_edition_author").checked = !!data.permission_botc_edition_author;
          document.getElementById("perm_trpg_dm").checked = !!data.permission_trpg_dm;
          document.getElementById("perm_trpg_module_author").checked = !!data.permission_trpg_module_author;
          document.getElementById("association_role").value = data.association_role || "普通玩家";
          setStatus(true, "✅ 档案读取成功");
        } else {
          setStatus(false, "❌ 读取失败：" + (data.reason || "未知错误"));
        }
      } catch (e) {
        setStatus(false, "❌ 网络错误或服务器异常");
      }
    };
  </script>
</body>
</html>
