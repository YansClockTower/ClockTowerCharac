<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}活动信息板{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="{{ url_for('events.static', filename='style.css') }}">
    <script src="{{ url_for('users.static', filename='js/auth_client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app_modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wechat_contact.js') }}"></script>
    <script src="{{ url_for('users.static', filename='js/email_bind_prompt.js') }}"></script>
    {% block extra_css %}{% endblock %}
</head>
<body class="page-shell page-shell--narrow">
    {% include "_site_header.html" %}

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.ClockTowerAuth) {
          ClockTowerAuth.establishSessionFromStoredToken();
        }
      });
    </script>
</body>
</html>
