<button type="button" class="wechat-icon-btn" data-organizer-wechat
        data-name="{{ name }}" data-wechat="{{ wechat or '' }}"
        {% if chat_event_id %}data-chat-url="{{ url_for('events.chat_room_route', kind=chat_kind, event_id=chat_event_id) }}"{% endif %}
        title="查看微信号" aria-label="查看{{ name }}的微信号">
  <img src="{{ url_for('events.static', filename='img/wechat.png') }}" alt="" width="18" height="18">
</button>
