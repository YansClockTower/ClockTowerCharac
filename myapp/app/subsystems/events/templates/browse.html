{% extends "base.html" %}

{% block title %}轻桌游聚集地 - 活动板{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('events.static', filename='browse.css') }}">
{% endblock %}

{% block content %}

    <div class="event-list">
        <div class="browse-header-row">
            <h2>活动列表 <span class="browse-count">（显示 {{ events|length }} / 共 {{ events_total }} 个）</span></h2>
            <a href="{{ url_for('events.add_event_route') }}" class="base-btn corner-button">
                + 新活动
            </a>
        </div>

        <nav class="browse-tabs" aria-label="活动列表视图">
            <a class="browse-tab {% if browse_tab == 'all' %}is-active{% endif %}"
               href="{{ url_for('events.browse_events') }}">全部</a>
            <a class="browse-tab {% if browse_tab == 'light' %}is-active{% endif %}"
               href="{{ url_for('events.browse_events', tab='light') }}">轻桌游聚会</a>
            <a class="browse-tab {% if browse_tab == 'my' %}is-active{% endif %}"
               href="{{ url_for('events.browse_events', tab='my') }}">我的活动</a>
        </nav>

        {% include "event_cards_list.html" %}

    </div>

    <script>
        function refToEdit(eventId) {
            const urlTemplate = "{{ url_for('events.edit_event_route', event_id=7777) }}";
            window.location.href = urlTemplate.replace("7777", eventId);
        }
        function signIn(eventId, signcode) {
            const urlTemplate = "{{ url_for('events.signin_event_route', event_id=7777) }}";
            fetch(urlTemplate.replace("7777", eventId), {
                method: "POST",
                credentials: "include",
                headers: ClockTowerAuth.authHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({ signcode: signcode })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert("签到失败:" + data.message);
                }
            })
            .catch(() => alert("提交请求出错，请稍后再试。"));
        }
        function promptForNote(eventId) {
            const note = prompt("请输入您要设置的备注：");
            if (note !== null) {
                const urlTemplate = "{{ url_for('events.set_joininfo_route', event_id=7777) }}";
                fetch(urlTemplate.replace("7777", eventId), {
                    method: "POST",
                    credentials: "include",
                    headers: ClockTowerAuth.authHeaders({ "Content-Type": "application/json" }),
                    body: JSON.stringify({ note: note })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("备注设置成功！");
                        window.location.reload();
                    } else {
                        alert("设置备注失败");
                    }
                })
                .catch(() => alert("提交请求出错，请稍后再试。"));
            }
        }
        function editFriend(eventId, isMore) {
            const urlTemplate = "{{ url_for('events.set_joininfo_route', event_id=7777) }}";
            fetch(urlTemplate.replace("7777", eventId), {
                method: "POST",
                credentials: "include",
                headers: ClockTowerAuth.authHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({ friend: isMore })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert("随行人设置失败:" + data.message);
                }
            })
            .catch(() => alert("提交请求出错，请稍后再试。"));
        }
    </script>
{% endblock %}
