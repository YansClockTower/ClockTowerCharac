<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>索引页</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body class="portal-home">
    <img
        id="user-avatar"
        src="{{ url_for('users.read_icon', id=userid) }}"
        alt="用户头像"
    >
    <h1>欢迎访问, <a href="{{ url_for('users.user_page') }}">{{ username }}</a></h1>

    <div class="primary-nav">
        {% if show_become_member %}
        <a class="become-member-cta" href="{{ url_for('users.membership') }}">成为布鸽会员</a>
        {% endif %}
        <button type="button" onclick="toggleSection('club-section')">桌游协会事务</button>
        <div id="club-section" class="secondary-nav">
            <a href="{{ url_for('events.browse_events') }}">活动面板</a>
            <a href="{{ url_for('boardgames.browse') }}">桌游浏览/借用</a>
        </div>

        <button type="button" onclick="toggleSection('botc-tools-section')">《血染钟楼》工具</button>
        <div id="botc-tools-section" class="secondary-nav">
            <a href="https://yanice.online/grimoire/">线上魔典</a>
            <a href="{{ url_for('character.character_list') }}">浏览已收录角色</a>
            <a href="{{ url_for('editionpdf.view_all_editions') }}">浏览已收录剧本</a>
            <a href="{{ url_for('edition.select_characters') }}">自制剧本</a>
            <a href="{{ url_for('edition.import_json') }}">收录新剧本</a>
        </div>

        <button type="button" onclick="toggleSection('trpg-tools-section')">TRPG(跑团)工具</button>
        <div id="trpg-tools-section" class="secondary-nav">
            <span class="disabled-item">电子跑团系统(开发中)</span>
            <span class="disabled-item">TRPG模组编辑器(开发中)</span>
        </div>
    </div>
    <p class="footer-note">
        桌游协会资料站 | 粤ICP备2025432638号
    </p>

    <script src="{{ url_for('users.static', filename='js/auth_client.js') }}"></script>
    <script src="{{ url_for('users.static', filename='js/email_bind_prompt.js') }}"></script>
    <script>
        function toggleSection(sectionId) {
            const target = document.getElementById(sectionId);
            if (!target) return;
            target.classList.toggle("active");
        }
    </script>
</body>
</html>
