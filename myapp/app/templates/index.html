<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>索引页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f7f7f7;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 180px;
        }
        .button-container a {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        .button-container a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <img id="user-avatar" 
        src="{{ url_for('users.read_icon', id=userid) }}"
        alt="用户头像" 
        style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 10px auto; border: 2px solid #ddd;"
    >
    <h1>欢迎访问, <a href="/user/">{{ username }}</a></h1>
    <!-- <h1>欢迎访问!</h1> -->

    <div class="button-container">
        <a href="/character">浏览已收录角色</a>
        <a href="/edition">浏览已收录剧本</a>
        <a href="/grimoire/">电子魔典</a>
        <a href="/select">自制剧本</a>
        <a href="/import">收录新剧本</a>
    </div>
    <p>
        自制剧本资料站 | 粤ICP备2025432638号
    </p>

</body>
</html>
