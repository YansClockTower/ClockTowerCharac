<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>用户登录</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 40px; }
    .card { max-width: 420px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
    h2 { margin: 0 0 12px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .muted { color: #666; font-size: 14px; }
    .center { text-align: center; }
    .spacer { height: 10px; }
    /* ... 移除不必要的权限样式 ... */
  </style>
</head>
<body>
  <div class="card">
    <h2>用户认证</h2>
    <div id="view">
      <div id="auth-forms">
        <div>
          <h3>登录</h3>
          <input id="login-username" placeholder="用户名" />
          <input id="login-password" type="password" placeholder="密码" />
          <button id="loginBtn">登录</button>
        </div>
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div>
          <h3>注册</h3>
          <input id="reg-username" placeholder="用户名" />
          <input id="reg-password" type="password" placeholder="密码" />
          <input id="reg-password2" type="password" placeholder="确认密码" />
          <div class="row">
            <button id="registerBtn">注册</button>
          </div>
        </div>
      </div>
      <p id="loading-msg" class="center">正在检查登录状态...</p>
    </div>
  </div>

  <script>
    // 定义常量和工具函数
    const INFO_PAGE_URL = "/user"; // 假设用户信息页面的新路径是 /user/profile
    
    // 修正后的 getAuthHeaders 函数 
    const getAuthHeaders = () => {
      // 只需要设置内容类型，不需要手动添加 Authorization Header
      // 浏览器会自动携带 Cookie (因为后端设置了 httponly=True)
      const headers = { 'Content-Type': 'application/json' };
      return headers;
    };

    async function fetchMe() {
      try {
        const res = await fetch('/user/me', {
          method: 'GET',
          credentials: 'include',
          headers: getAuthHeaders(),
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        console.error('Fetch /me error:', e);
        return null;
      }
    }

    /**
     * @param {string} username 
     * @param {string} password 
     * @returns {boolean} 成功返回 true，失败返回 false
     */
    async function handleLogin(username, password) {
        try {
            const res = await fetch('/user/login_submit', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json().catch(() => ({}));

            if (data && data.token) {

                // 再次确认登录状态（虽然不是必须，但更严谨）
                const me = await fetchMe();
                if (me && (me.username || me.user || me.authenticated)) {
                    return true;
                } else if (data && data.token) {
                    // 如果 token 存在但 /user/me 失败，仍视为成功尝试跳转
                    return true; 
                }
            }
            alert('登录失败：请检查用户名或密码。');
            return false;
        } catch (e) {
            console.error(e);
            alert('登录请求失败');
            return false;
        }
    }

    // 登录事件处理
    const loginsubmit = async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) return alert('请输入用户名和密码');

        const success = await handleLogin(username, password);
        if (success) {
            // 成功跳转到用户信息页
            location.href = INFO_PAGE_URL;
        }
    };

    // 注册事件处理
    const registersubmit = async () => {
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        const password2 = document.getElementById('reg-password2').value;
        if (!username || !password || !password2) return alert('请输入完整的注册信息');
        if (password !== password2) return alert('两次输入的密码不一致');

        try {
            // 1. 提交注册
            const res = await fetch('/user/register_submit', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json().catch(() => ({}));

            if (data && (data.status === 'success' || data.success)) {
                alert('注册成功。正在尝试自动登录...');
                
                // 2. 自动登录并跳转
                const success = await handleLogin(username, password);
                if (success) {
                    location.href = INFO_PAGE_URL;
                }
            } else {
                alert('注册失败，请检查用户名是否已存在。');
            }
        } catch (e) {
            console.error(e);
            alert('注册请求失败');
        }
    };

    // 初始化和事件绑定
    document.addEventListener('DOMContentLoaded', async () => {
        const authForms = document.getElementById('auth-forms');
        const loadingMsg = document.getElementById('loading-msg');
        
        // 1. 检查登录状态
        const me = await fetchMe();
        
        if (me && (me.username || me.user)) {
            // 已登录：存储信息并直接跳转
            loadingMsg.textContent = "已登录，正在跳转...";
            location.href = INFO_PAGE_URL;
        } else {
            // 未登录：显示表单，隐藏加载提示
            loadingMsg.style.display = 'none';
            authForms.style.display = 'block';

            // 2. 绑定事件
            document.getElementById('loginBtn').addEventListener('click', loginsubmit);
            document.getElementById('registerBtn').addEventListener('click', registersubmit);
        }
    });

    // 确保 auth-forms 默认隐藏，在 JS 检查状态后再显示
    document.getElementById('auth-forms').style.display = 'none';
  </script>
</body>
</html>
