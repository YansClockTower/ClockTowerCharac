<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>用户登录</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 40px; }
    .card { max-width: 420px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
    h2 { margin: 0 0 12px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .muted { color: #666; font-size: 14px; }
    .center { text-align: center; }
    .spacer { height: 10px; }
    .permissions-card {
      max-width: 400px;
      margin: 0 auto;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .permissions-card h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }
    .permissions-table {
      width: 100%;
      border-collapse: collapse;
    }
    .permissions-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
    }
    .permissions-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>用户认证</h2>
    <div id="view"></div>
  </div>

  <script>
    const getAuthHeaders = () => {
      const token = localStorage.getItem('token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return headers;
    };

    async function fetchMe() {
      try {
        const res = await fetch('/user/me', {
          method: 'GET',
          credentials: 'include',
          headers: getAuthHeaders(),
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        console.error('Fetch /me error:', e);
        return null;
      }
    }

    function renderLoggedIn(username, me) {
      const root = document.getElementById('view');
      const editUserBtn = me.permission_manage_accounts 
    ? `<button id="editUserBtn">编辑用户权限</button>` 
    : "";
      root.innerHTML = `
        <p class="center">欢迎，<b>${username}</b></p>
        <table class="permissions-table">
            <tr><td>用户权限管理</td><td>${me.permission_manage_accounts ? '✅ 是' : '❌ 否'}</td></tr>
            <tr><td>个人剧本管理</td><td>${me.permission_manage_own_editions ? '✅ 是' : '❌ 否'}</td></tr>
            <tr><td>全部剧本管理</td><td>${me.permission_manage_all_editions ? '✅ 是' : '❌ 否'}</td></tr>
            <tr><td>剧本导入与创建</td><td>${me.permission_manage_create_editions ? '✅ 是' : '❌ 否'}</td></tr>
            <tr><td>魔典说书人</td><td>${me.permission_storyteller ? '✅ 是' : '❌ 否'}</td></tr>
            <tr><td>语音说书人</td><td>${me.permission_storyteller_vocal ? '✅ 是' : '❌ 否'}</td></tr>
          </table>
        ${editUserBtn}
        <button id="backBtn">返回首页</button>
        <button id="logoutBtn">退出登录</button>
        <p class="muted center">退出将清除本地 token，并尝试让后端清理会话。</p>
      `;
      document.getElementById('backBtn').onclick = async () => {
        location.href = '/';
      };
      document.getElementById('editUserBtn').onclick = async () => {
        location.href = '/user/edit_user';
      };
      document.getElementById('logoutBtn').onclick = async () => {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        try {
          await fetch('/user/logout', { method: 'POST', credentials: 'include', headers: getAuthHeaders() });
        } catch (e) {
          console.warn('Logout request failed (ignored):', e);
        }
        location.reload();
      };
    }

    function renderAuthForms() {
      const root = document.getElementById('view');
      root.innerHTML = `
        <div>
          <h3>登录</h3>
          <input id="login-username" placeholder="用户名" />
          <input id="login-password" type="password" placeholder="密码" />
          <button id="loginBtn">登录</button>
        </div>
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div>
          <h3>注册</h3>
          <input id="reg-username" placeholder="用户名" />
          <input id="reg-password" type="password" placeholder="密码" />
          <input id="reg-password2" type="password" placeholder="确认密码" />
          <div class="row">
            <button id="registerBtn">注册</button>
          </div>
        </div>
      `;

      document.getElementById('loginBtn').onclick = async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) return alert('请输入用户名和密码');

        try {
          const res = await fetch('/user/login_submit', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));

          if (data && data.token) localStorage.setItem('token', data.token);
          if (data && (data.username || data.user)) {
            localStorage.setItem('username', data.username || data.user);
          }

          const me = await fetchMe();
          if (me && (me.username || me.user || me.authenticated)) {
            localStorage.setItem('username', me.username || me.user || '');
            location.reload();
          } else if (data && data.token) {
            location.reload();
          } else {
            alert('登录失败：请检查用户名或密码。');
          }
        } catch (e) {
          console.error(e);
          alert('登录请求失败');
        }
      };

      document.getElementById('registerBtn').onclick = async () => {
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        const password2 = document.getElementById('reg-password2').value;
        if (!username || !password || !password2) return alert('请输入完整的注册信息');
        if (password !== password2) return alert('两次输入的密码不一致');

        try {
          const res = await fetch('/user/register_submit', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));
          if (data && (data.status || data.status === 'success')) {
            alert('注册成功。');
            // 注册成功后自动登录
            try {
              const res = await fetch('/user/login_submit', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
              });
              const data = await res.json().catch(() => ({}));

              if (data && data.token) localStorage.setItem('token', data.token);
              if (data && (data.username || data.user)) {
                localStorage.setItem('username', data.username || data.user);
              }

              const me = await fetchMe();
              if (me && (me.username || me.user || me.authenticated)) {
                localStorage.setItem('username', me.username || me.user || '');
                location.reload();
              } else if (data && data.token) {
                location.reload();
              }
            } catch (e) {
              console.error(e);
            }
          } else {
            alert('注册失败，请检查用户名是否已存在。');
          }
        } catch (e) {
          console.error(e);
          alert('注册请求失败');
        }
      };
    }

    (async function init() {
      const me = await fetchMe();
      if (me && (me.username || me.user)) {
        const name = me.username || me.user;
        localStorage.setItem('username', name);
        renderLoggedIn(name, me);
      } else {
        renderAuthForms();
      }
    })();
  </script>
</body>
</html>
